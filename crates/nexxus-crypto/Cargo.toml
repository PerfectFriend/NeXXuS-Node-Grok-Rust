[package]
name = "nexxus-crypto"
version = "0.1.0"
edition = "2021"
description = "NeXXXUs keys, HELLO v3 and frames. Wire-compatible with Linux node 0.10.0."
license = "MIT"

[dependencies]
bip39 = "2.2"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hex = "0.4"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
serde_json = "1"
